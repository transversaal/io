<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Transversaal Logo Reveal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; background: #ffffff; }
  * { box-sizing: border-box; }

  .tv-wrap {
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0;
  }

  /* Same 900 x 615 stage as before, so existing embeds keep their size. */
  .tv-stage {
    container-type: inline-size;
    position: relative;
    width: 100%;
    max-width: 900px;
    aspect-ratio: 900 / 615;
    cursor: pointer;
    font-family: 'Archivo', -apple-system, BlinkMacSystemFont, sans-serif;
    -webkit-tap-highlight-color: transparent;
  }

  /* Logo stays fully visible; on rollover it lifts slightly to make room. */
  .tv-logo {
    position: absolute;
    width: 60cqw;
    left: 20cqw;
    top: 16cqw;
    z-index: 1;
    pointer-events: none;
    transform: translateY(0) scale(1);
    transition: transform .6s cubic-bezier(.22,.8,.3,1);
  }
  .tv-stage:hover .tv-logo,
  .tv-stage.is-open .tv-logo { transform: translateY(-3.333cqw) scale(.95); }

  /* ENTER NETWORK link rises in underneath the logo. */
  .tv-enter {
    position: absolute;
    left: 50%;
    top: 52.222cqw;
    z-index: 5;
    display: block;
    /* Only the words are centred. The left padding balances the tracking
       after the last letter; the arrow hangs outside the box (below). */
    padding: .889cqw 0 .889cqw .22em;
    line-height: 1.2;
    font-size: 2.444cqw;
    font-weight: 600;
    letter-spacing: .22em;
    color: #c0360f;
    text-decoration: none;
    white-space: nowrap;
    opacity: 0;
    pointer-events: none;
    transform: translate(-50%, 1.778cqw);
    transition: opacity .45s ease .12s, transform .6s cubic-bezier(.25,.9,.3,1.2) .12s;
  }
  .tv-stage:hover .tv-enter,
  .tv-stage.is-open .tv-enter {
    opacity: 1;
    pointer-events: auto;
    transform: translate(-50%, 0);
  }

  /* Underline draws in from the centre once the link has arrived. */
  .tv-enter::after {
    content: "";
    position: absolute;
    left: 50%;
    bottom: 0;
    width: 100%;
    height: .222cqw;
    min-height: 1px;
    background: currentColor;
    transform: translateX(-50%) scaleX(0);
    transition: transform .45s cubic-bezier(.22,.8,.3,1) 0s;
  }
  .tv-stage:hover .tv-enter::after,
  .tv-stage.is-open .tv-enter::after {
    transform: translateX(-50%) scaleX(1);
    transition-delay: .35s;
  }

  .tv-arrow {
    position: absolute;
    left: 100%;
    top: 50%;
    margin-left: .889cqw;
    letter-spacing: 0;
    transform: translateY(-50%);
    transition: transform .25s ease;
  }
  .tv-enter:hover .tv-arrow,
  .tv-enter:focus-visible .tv-arrow { transform: translate(.889cqw, -50%); }
  .tv-enter:hover,
  .tv-enter:focus-visible { color: #9e2a08; outline: none; }

  @media (prefers-reduced-motion: reduce) {
    .tv-logo, .tv-enter, .tv-enter::after, .tv-arrow { transition-duration: .01ms; transition-delay: 0s; }
  }
</style>
</head>
<body>
<div class="tv-wrap">
  <div class="tv-stage" id="tvStage">
    <img class="tv-logo" src="assets/logo.png" alt="Transversaal">
    <a class="tv-enter" href="https://www.transversaal.io/network" target="_top">
      ENTER NETWORK<span class="tv-arrow" aria-hidden="true">&rarr;</span>
    </a>
  </div>
</div>

<script>
  (function () {
    var stage = document.getElementById('tvStage');
    if (!stage) return;
    stage.addEventListener('click', function (e) {
      if (e.target.closest('a')) return;
      stage.classList.toggle('is-open');
    });
  })();
</script>
</body>
</html>
